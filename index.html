<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A6B55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計帳簿">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>家計帳簿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a ruled account book — sticky month header, one working column (max 980px), bottom tab bar on phones, top tabs on wide screens. */
:root {
  --paper: #F2F5F1; --sheet: #FBFCFA; --ink: #17241F; --ink-2: #4C5C55; --ink-3: #7D8B85;
  --rule: #DCE3DE; --rule-2: #C9D3CD; --accent: #0A6B55; --accent-soft: #DDEEE7;
  --income: #0A8A6C; --expense: #C7822A; --neg: #B3412E; --neg-soft: #F7E3DE; --warn: #9A6A00; --warn-soft: #F6EBCB; --ok: #2F7A3E; --ok-soft: #E0F0E2;
  --shadow: 0 1px 2px rgba(23,36,31,.06), 0 8px 24px rgba(23,36,31,.08);
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0F1513; --sheet: #151C1A; --ink: #E2EAE6; --ink-2: #A9B7B1; --ink-3: #7A8983;
  --rule: #24302C; --rule-2: #31403B; --accent: #5CC3A5; --accent-soft: #173029;
  --income: #2A9878; --expense: #C27E30; --neg: #EE8C76; --neg-soft: #3A1F1A; --warn: #E2B754; --warn-soft: #362C12; --ok: #7CC78B; --ok-soft: #1A2E1E;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0F1513; --sheet: #151C1A; --ink: #E2EAE6; --ink-2: #A9B7B1; --ink-3: #7A8983;
  --rule: #24302C; --rule-2: #31403B; --accent: #5CC3A5; --accent-soft: #173029;
  --income: #2A9878; --expense: #C27E30; --neg: #EE8C76; --neg-soft: #3A1F1A; --warn: #E2B754; --warn-soft: #362C12; --ok: #7CC78B; --ok-soft: #1A2E1E;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; line-height: 1.15; margin-right: auto; }
.brand b { font-size: 17px; letter-spacing: .02em; }
.brand small { color: var(--ink-3); font-size: 12px; }
.monthpick { display: flex; align-items: center; gap: 4px; background: var(--sheet); border: 1px solid var(--rule-2); border-radius: 999px; padding: 2px; }
.monthpick button { border: 0; background: none; width: 34px; height: 34px; border-radius: 999px; cursor: pointer; font-size: 18px; color: var(--ink-2); }
.monthpick button:hover { background: var(--accent-soft); color: var(--accent); }
.monthpick select { border: 0; background: none; font-weight: 700; padding: 4px 2px; cursor: pointer; }
nav.tabs { display: flex; gap: 2px; }
nav.tabs button { border: 0; background: none; padding: 8px 12px; border-radius: 10px; cursor: pointer; color: var(--ink-2); font-weight: 500; display: flex; align-items: center; gap: 6px; position: relative; }
nav.tabs button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
nav.tabs svg { width: 18px; height: 18px; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--neg); color: var(--sheet); font: 600 11px/18px var(--f-num); text-align: center; }
@media (max-width: 759px) {
  header.top { backdrop-filter: none; background: var(--paper); }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--sheet); border-top: 1px solid var(--rule); padding: 4px max(6px, env(safe-area-inset-left, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-right, 0px)); justify-content: space-around; }
  nav.tabs button { flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 4px; flex: 1; }
  nav.tabs .badge { position: absolute; top: 0; right: calc(50% - 22px); }
  main { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
}
@media (min-width: 760px) { nav.tabs { order: 3; width: 100%; } }
main .wrap { padding-block: 18px 40px; display: grid; gap: 18px; }
h1.view { font-size: 22px; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h2 { font-size: 15px; margin: 0; letter-spacing: .04em; color: var(--ink-2); font-weight: 700; }
.sub { color: var(--ink-3); font-size: 13px; }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.panel > header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
/* ledger figures */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--rule); border-radius: 14px; background: var(--sheet); overflow: hidden; }
.kpi { padding: 14px 16px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin: 0 -1px -1px 0; display: grid; gap: 2px; }
.kpi .lbl { font-size: 12px; color: var(--ink-3); letter-spacing: .06em; }
.kpi .val { font: 600 22px/1.2 var(--f-num); font-variant-numeric: tabular-nums; }
.kpi .note { font-size: 12px; color: var(--ink-2); }
.pos { color: var(--income); } .negv { color: var(--neg); }
/* checklist */
.checks { display: grid; gap: 0; }
.check { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px dashed var(--rule); }
.check:first-child { border-top: 0; }
.dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.dot.ok { background: var(--ok-soft); color: var(--ok); } .dot.warn { background: var(--warn-soft); color: var(--warn); } .dot.bad { background: var(--neg-soft); color: var(--neg); }
.check .act { font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; border: 1px solid transparent; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--neg-soft); color: var(--neg); }
.pill.mute { background: transparent; border-color: var(--rule-2); color: var(--ink-2); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
/* buttons */
.btn { border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.btn.primary:hover { filter: brightness(1.08); color: var(--sheet); }
.btn.danger { color: var(--neg); border-color: color-mix(in srgb, var(--neg) 40%, var(--rule-2)); }
.btn.small { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: default; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-weight: 500; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* bars */
.cats { display: grid; gap: 8px; }
.cat { text-align: left; width: 100%; display: grid; grid-template-columns: 7.5em 1fr auto; align-items: center; gap: 10px; font-size: 14px; }
.cat .bar { height: 10px; background: var(--rule); border-radius: 0 4px 4px 0; overflow: hidden; }
.cat .bar i { display: block; height: 100%; background: var(--expense); border-radius: 0 4px 4px 0; }
.cat .amt { min-width: 6.5em; text-align: right; }
/* chart */
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.5; min-width: 140px; transform: translate(-50%, -100%); white-space: nowrap; box-shadow: var(--shadow); }
.tip b { display: block; margin-bottom: 2px; }
/* tables */
.tablebox { overflow-x: auto; border: 1px solid var(--rule); border-radius: 14px; background: var(--sheet); }
table.ledger { border-collapse: collapse; width: 100%; font-size: 13px; }
table.ledger th, table.ledger td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); }
table.ledger th:first-child, table.ledger td:first-child { text-align: left; position: sticky; left: 0; background: var(--sheet); z-index: 1; }
table.ledger thead th { color: var(--ink-3); font-weight: 500; font-size: 12px; background: var(--sheet); }
table.ledger thead th.cur { color: var(--accent); }
table.ledger td.cur { background: color-mix(in srgb, var(--accent-soft) 55%, var(--sheet)); }
table.ledger tr.total td { font-weight: 700; }
table.ledger tr.sep td { border-top: 2px solid var(--rule-2); }
table.ledger td.z { color: var(--ink-3); }
/* lists */
.list { display: grid; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 11px 2px; border-top: 1px solid var(--rule); align-items: center; cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.row:hover { background: color-mix(in srgb, var(--accent-soft) 40%, transparent); }
.row .t { font-weight: 500; overflow-wrap: anywhere; }
.row .m { font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row .a { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; font-weight: 500; }
.dayhead { font-size: 12px; color: var(--ink-3); padding: 14px 2px 4px; letter-spacing: .05em; display: flex; justify-content: space-between; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 11px 0; border-top: 1px solid var(--rule); }
.pair .side { min-width: 0; display: grid; gap: 2px; }
.pair .side .k { font-size: 11px; color: var(--ink-3); letter-spacing: .08em; }
.pair .acts { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.search { flex: 1 1 200px; min-width: 0; border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 10px; padding: 8px 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
details > summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
/* forms */
.form { display: grid; gap: 12px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--ink-2); letter-spacing: .04em; }
.field input, .field select, .field textarea { border: 1px solid var(--rule-2); background: var(--paper); border-radius: 10px; padding: 9px 11px; width: 100%; min-width: 0; }
.fields2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.nwgrid { display: grid; grid-template-columns: 1fr 9.5em; gap: 8px 12px; align-items: center; }
.nwgrid .h { font-size: 12px; color: var(--ink-3); letter-spacing: .06em; grid-column: 1 / -1; margin-top: 6px; }
.nwgrid input { text-align: right; font-family: var(--f-num); border: 1px solid var(--rule-2); background: var(--paper); border-radius: 8px; padding: 7px 9px; width: 100%; min-width: 0; }
.nwgrid .hint { font-size: 11px; color: var(--ink-3); grid-column: 1 / -1; margin-top: -6px; }
/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(10,18,15,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--sheet); width: min(560px, 100%); max-height: 88vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; box-shadow: var(--shadow); }
@media (min-width: 760px) { .scrim { align-items: center; } .sheet { border-radius: 18px; } }
.sheet h3 { margin: 0; font-size: 17px; }
.sheet .facts { background: var(--paper); border-radius: 10px; padding: 10px 12px; font-size: 13px; display: grid; gap: 3px; overflow-wrap: anywhere; }
.sheet .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; z-index: 60; font-size: 14px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); display: grid; gap: 10px; justify-items: center; }
.drop { border: 2px dashed var(--rule-2); border-radius: 14px; padding: 22px 16px; display: grid; gap: 12px; justify-items: center; text-align: center; background: var(--paper); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.filelist { display: grid; font-size: 13px; }
.filelist .f { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--rule); }
.filelist .f .e { grid-column: 1 / -1; color: var(--neg); font-size: 12px; }
.mono { font-family: var(--f-num); font-size: 12px; }
.callout { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 10px 12px; border-radius: 0 10px 10px 0; font-size: 13px; }
@media (prefers-reduced-motion: no-preference) { .panel, .kpis { animation: rise .35s ease both; } @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } } }
#fab { position: fixed; z-index: 40; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 18px; border: 0; background: var(--accent); color: var(--sheet); box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; }
#fab svg { width: 26px; height: 26px; }
#fab[data-state="offline"], #fab[data-state="error"] { background: var(--warn); }
@media (max-width: 759px) { #fab { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); } }
.qamt { display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--accent); padding: 4px 2px; }
.qamt span { font: 600 18px var(--f-num); color: var(--ink-3); }
.qamt input { border: 0; background: none; font: 600 34px/1.1 var(--f-num); width: 100%; min-width: 0; padding: 0; outline: none; }
.qrow { display: grid; grid-template-columns: 2.6em 1fr; gap: 8px; align-items: start; }
.qlbl { font-size: 12px; color: var(--ink-3); padding-top: 6px; letter-spacing: .06em; }
.qtpl { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
.qtpl .chip { white-space: nowrap; }
#q-desc { border: 1px solid var(--rule-2); background: var(--paper); border-radius: 10px; padding: 9px 11px; width: 100%; }
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><b>家計帳簿</b><small id="sync">連線中…</small></div>
  <div class="monthpick" id="monthpick" hidden>
    <button type="button" data-act="mprev" aria-label="上個月">‹</button>
    <select id="month-select" aria-label="報表月份"></select>
    <button type="button" data-act="mnext" aria-label="下個月">›</button>
  </div>
  <nav class="tabs" id="tabs" aria-label="頁面"></nav>
</div></header>
<main><div class="wrap" id="view">
  <div class="panel empty"><b>正在讀取你的帳簿…</b><span class="sub">資料存在這個 App 的雲端資料庫，手機和電腦看到的是同一份。</span></div>
</div></main>
<div id="sheet-root"></div>
<div id="toast-root"></div>

<script src="./engine.js?v=1.5.1"></script>
<script src="./store.js?v=1.5.1"></script>
<script src="./app.js?v=1.5.1"></script>
</body>
</html>
